services:
  db:
    image: postgres:17
    # Only the database settings: the Gemini key never reaches this container
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD in .env}
    healthcheck:
      # TCP check: during first-time init Postgres listens only on its local socket
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  agent:
    build: ./agent
    env_file: .env
    environment:
      DB_HOST: db
      DATA_DIR: /data
      DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD:?Set a unique DB_READONLY_PASSWORD in .env}
    volumes:
      - ./data:/data:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s